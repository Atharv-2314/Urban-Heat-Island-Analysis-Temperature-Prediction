# ==============================================================================
# 42-CITY URBAN HEAT ISLAND (UHI) PROJECT CONFIGURATION
# ==============================================================================

project:
  name: "Urban-Heat-Island-Analysis-Temperature-Prediction"
  version: "1.0.0"
  random_seed: 42

study_scope:
  years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  total_years: 10
  total_cities: 42
  expected_city_month_rows: 5040  # 42 cities * 10 years * 12 months

paths:
  raw_monthly_dir: "data/raw/monthly_level"
  raw_pixel_dir: "data/raw/pixel_level/UHI_Pixel_Data"
  interim_monthly_merged: "data/interim/monthly_level/UHI_MonthlyDataset_Merged.csv"
  interim_pixel_dir: "data/interim/pixel_level/citywise_dataset"
  processed_monthly_parquet: "data/processed/monthly_level/uhi_monthly_clean.parquet"
  processed_splits_dir: "data/processed/splits"
  models_dir: "models"
  reports_dir: "reports"

splits:
  temporal:
    train_years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023]
    val_years: [2024]
    test_years: [2025]

# Scientific constraints & bounds for 10-point validation
scientific_bounds:
  lst_min_celsius: -50.0
  lst_max_celsius: 70.0
  ndvi_min: -1.0
  ndvi_max: 1.0
  ndbi_min: -1.0
  ndbi_max: 1.0
  ndwi_min: -1.0
  ndwi_max: 1.0
  precipitation_min: 0.0
  wind_speed_min: 0.0
  strict_no_zero_imputation: true

