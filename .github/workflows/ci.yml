name: CI — UHI Analysis Project

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # Python: lint, type-check, and test
  # ─────────────────────────────────────────────────────────
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q --tb=short

  # ─────────────────────────────────────────────────────────
  # Node.js backend: build + test
  # ─────────────────────────────────────────────────────────
  server-tests:
    name: Node.js Backend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run Jest tests
        working-directory: server
        run: npm test

  # ─────────────────────────────────────────────────────────
  # React frontend: lint + Vitest + production build
  # ─────────────────────────────────────────────────────────
  client-tests:
    name: React Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Run Vitest
        working-directory: client
        run: npm test

      - name: Build production bundle
        working-directory: client
        run: npm run build

  # ─────────────────────────────────────────────────────────
  # Docker: build image (smoke test only — no push)
  # ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [python-tests, server-tests, client-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t uhi-app:ci .
